<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="Professional light meter for photography with spot metering">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Light Meter Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap');
        
        :root {
            --bg-dark: #0a0a0a;
            --bg-panel: #141414;
            --text-primary: #f5f5f5;
            --text-secondary: #888;
            --accent: #00ff88;
            --accent-dim: #00ff8844;
            --warning: #ff3366;
            --grid: #222;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'JetBrains Mono', 'Courier New', 'Monaco', 'Consolas', monospace;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }
        
        #camera-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1;
        }
        
        #camera {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Live Preview Window */
        #live-preview {
            position: absolute;
            top: 80px;
            right: 20px;
            width: 120px;
            height: 120px;
            border: 2px solid var(--accent);
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(0, 0, 0, 0.3);
            z-index: 4;
        }
        
        #preview-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #preview-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            color: var(--accent);
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px;
            text-align: center;
            font-weight: 600;
        }
        
        /* Meter Button */
        #meter-button-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
        }
        
        #meter-button {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 255, 136, 0.95);
            color: var(--bg-dark);
            border: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3),
                        0 2px 4px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        
        #meter-button:active {
            transform: scale(0.95);
        }
        
        #meter-button.metering {
            background: rgba(255, 51, 102, 0.95);
            color: white;
            box-shadow: 0 4px 20px rgba(255, 51, 102, 0.3),
                        0 2px 4px rgba(0, 0, 0, 0.2);
            animation: pulse-red 1.5s ease-in-out infinite;
        }
        
        #meter-button svg {
            width: 20px;
            height: 20px;
        }
        
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        #spot-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.3),
                        inset 0 0 0 2px rgba(0, 0, 0, 0.3);
            transition: opacity 0.3s ease;
        }
        
        #spot-indicator.ambient-mode {
            opacity: 0.3;
            width: 200px;
            height: 200px;
            border-style: dashed;
        }
        
        #spot-indicator::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }
        
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        .ui-element {
            pointer-events: auto;
        }
        
        /* Top Bar */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        #app-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        
        #iso-selector, #metering-mode {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid var(--grid);
            border-radius: 6px;
            padding: 8px 12px;
            font-family: 'JetBrains Mono', 'Courier New', 'Monaco', 'Consolas', monospace;
            font-size: 13px;
            color: var(--text-primary);
            font-weight: 600;
            outline: none;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }
        
        /* Main Reading Display */
        #reading-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        #reading-display.show {
            opacity: 1;
        }
        
        #ev-value {
            font-family: 'Space Mono', 'Courier New', 'Monaco', 'Consolas', monospace;
            font-size: 72px;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-dim),
                         0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: -2px;
            line-height: 1;
        }
        
        #ev-label {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 600;
        }
        
        /* Exposure Combinations Bar */
        #exposure-combinations {
            position: absolute;
            bottom: 180px;
            left: 0;
            right: 0;
            padding: 0 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        
        #exposure-combinations.show {
            opacity: 1;
            pointer-events: auto;
        }
        
        #combinations-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 15px 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        #combinations-scroll::-webkit-scrollbar {
            display: none;
        }
        
        .combination-card {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid var(--grid);
            border-radius: 8px;
            padding: 12px 16px;
            min-width: 110px;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }
        
        .combination-card.suggested {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent-dim);
        }
        
        .combination-aperture {
            font-family: 'Space Mono', 'Courier New', monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        
        .combination-card.suggested .combination-aperture {
            color: var(--accent);
        }
        
        .combination-shutter {
            font-family: 'Space Mono', 'Courier New', monospace;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
        }
        
        .combination-card.suggested .combination-shutter {
            color: var(--accent);
        }
        
        .combinations-hint {
            position: absolute;
            bottom: 168px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            pointer-events: none;
        }
        
        /* Settings Panel */
        #settings-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20, 20, 20, 0.98);
            border-top: 1px solid var(--grid);
            padding: 24px 20px 32px;
            backdrop-filter: blur(20px);
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        
        #settings-panel.show {
            transform: translateY(0);
        }
        
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .settings-row:last-child {
            margin-bottom: 0;
        }
        
        .setting-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            font-weight: 600;
        }
        
        .setting-value {
            font-family: 'Space Mono', 'Courier New', 'Monaco', 'Consolas', monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        /* Error/Permission States */
        #permission-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        
        #permission-screen.hidden {
            display: none;
        }
        
        .permission-icon {
            font-size: 64px;
            margin-bottom: 24px;
            opacity: 0.3;
        }
        
        .permission-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .permission-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 300px;
            margin-bottom: 32px;
        }
        
        .btn-primary {
            background: var(--accent);
            color: var(--bg-dark);
            border: none;
            padding: 14px 32px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', 'Courier New', 'Monaco', 'Consolas', monospace;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary:active {
            transform: scale(0.95);
        }
        
        /* Canvas for analysis */
        #analysis-canvas {
            display: none;
        }
        
        /* Offline indicator */
        #offline-indicator {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 51, 102, 0.95);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 100;
            display: none;
            backdrop-filter: blur(10px);
        }
        
        #offline-indicator.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>
<body>
    <div id="offline-indicator">Offline Mode</div>
    
    <div id="permission-screen">
        <div class="permission-icon">📷</div>
        <div class="permission-title">Camera Access Required</div>
        <div class="permission-text">
            This light meter needs access to your camera to measure light levels for proper exposure.
        </div>
        <button class="btn-primary ui-element" onclick="requestCameraAccess()">Enable Camera</button>
    </div>

    <div id="camera-container">
        <video id="camera" autoplay playsinline></video>
        <div id="spot-indicator"></div>
        
        <!-- Live Preview Window -->
        <div id="live-preview">
            <canvas id="preview-canvas"></canvas>
            <div id="preview-label">Live Preview</div>
        </div>
        
        <!-- Meter Button -->
        <div id="meter-button-container" class="ui-element">
            <button id="meter-button" class="ui-element">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                </svg>
                <span id="meter-button-text">Meter</span>
            </button>
        </div>
    </div>

    <div id="ui-overlay">
        <div id="top-bar" class="ui-element">
            <div id="app-title">Light Meter</div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <select id="metering-mode" class="ui-element">
                    <option value="spot">Spot</option>
                    <option value="ambient">Ambient</option>
                </select>
                <select id="iso-selector" class="ui-element">
                    <option value="100">ISO 100</option>
                    <option value="200">ISO 200</option>
                    <option value="400">ISO 400</option>
                    <option value="800">ISO 800</option>
                    <option value="1600">ISO 1600</option>
                    <option value="3200">ISO 3200</option>
                    <option value="6400">ISO 6400</option>
                </select>
            </div>
        </div>

        <div id="reading-display" class="ui-element">
            <div id="ev-label">Exposure Value</div>
            <div id="ev-value">--</div>
        </div>

        <div id="exposure-combinations" class="ui-element">
            <div class="combinations-hint">← Swipe for more combinations →</div>
            <div id="combinations-scroll">
                <!-- Combinations will be populated by JavaScript -->
            </div>
        </div>

        <div id="settings-panel" class="ui-element">
            <div class="settings-row">
                <span class="setting-label">Aperture</span>
                <span class="setting-value" id="aperture-value">f/--</span>
            </div>
            <div class="settings-row">
                <span class="setting-label">Shutter</span>
                <span class="setting-value" id="shutter-value">--</span>
            </div>
            <div class="settings-row" style="border-top: 1px solid var(--grid); margin-top: 12px; padding-top: 12px;">
                <a href="calibration.html" style="color: var(--text-secondary); font-size: 11px; text-decoration: none; text-transform: uppercase; letter-spacing: 1.5px;">
                    ⚙️ Calibration Guide
                </a>
            </div>
        </div>
    </div>

    <canvas id="analysis-canvas"></canvas>

    <script src="app.js"></script>
    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed'));
        }
    </script>
</body>
</html>
